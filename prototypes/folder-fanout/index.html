<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Folder fan-out — hover to reveal cards</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="stage">
    <!--
      Hover / focus / tap the folder to fan the three cards out of it.
      Rest state: cards are tucked fully behind the folder's front pocket (hidden).
      Hover state: the container expands and the cards rise + fan out.
      Motion is transform-only (translate + rotate) so it stays GPU-smooth.
    -->
    <div class="folder-scale">
      <div
        class="folder"
        tabindex="0"
        role="button"
        aria-label="Folder — hover to fan the cards out"
      >
        <!-- Folder silhouette: tab + back panel (same dark fill, seams merge) -->
        <div class="folder-tab" aria-hidden="true"></div>
        <div class="folder-back" aria-hidden="true"></div>

        <!-- The three cards, tucked between the back panel and the front pocket -->
        <div class="cards" aria-hidden="true">
          <div class="card card--left">
            <div class="card-tile card-tile--pound">
              <span class="glyph">&pound;</span>
            </div>
          </div>
          <div class="card card--right">
            <div class="card-tile card-tile--tether">
              <span class="glyph">&#8366;</span>
            </div>
          </div>
          <div class="card card--mid">
            <div class="card-tile card-tile--dollar">
              <span class="glyph">$</span>
            </div>
          </div>
        </div>

        <!-- Front pocket: opaque, sits above the cards and masks their tucked bottoms -->
        <div class="folder-front" aria-hidden="true"></div>
      </div>
    </div>

    <p class="hint">Hover, focus, or tap the folder to fan the cards</p>
  </div>

  <script>
    // Touch devices have no :hover — toggle an explicit open state on tap.
    const folder = document.querySelector(".folder");
    folder.addEventListener("click", () => folder.classList.toggle("is-open"));
  </script>
</body>
</html>
