<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Select a card — prototype</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="stage">
    <div class="card-widget" id="widget">
      <div class="widget-header">
        <p class="widget-title">Select a card</p>
        <div class="widget-icon">
          <img src="assets/card-icon.svg" alt="" />
        </div>
      </div>

      <div class="stack">
        <div class="stack-card stack-card--1">
          <img src="assets/frame-yellow.svg" alt="" />
        </div>
        <div class="stack-card stack-card--2">
          <img src="assets/frame-green.svg" alt="" />
        </div>
        <div class="stack-card stack-card--3">
          <img src="assets/frame-blue.svg" alt="" />
        </div>
      </div>
    </div>

    <button class="replay-btn" id="replayBtn" type="button">Replay ↻</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
