<svg viewBox="0 0 88 88" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Team member portrait">
  <!-- Illustrated persona rebuilt to match the Figma avatar (braids, teal top, orange collar, gold jewellery). Transparent background so the parent circle tint shows through, mirroring the Figma structure. -->
  <defs>
    <clipPath id="ap-clip"><circle cx="44" cy="44" r="44"/></clipPath>
  </defs>
  <g clip-path="url(#ap-clip)">
    <!-- teal shirt / shoulders -->
    <path d="M4 90 C4 68 22 59 44 59 C66 59 84 68 84 90 Z" fill="#1c6e68"/>
    <!-- neck -->
    <rect x="36" y="48" width="16" height="18" rx="7" fill="#7a4a2b"/>
    <path d="M36 57 Q44 63 52 57 L52 63 Q44 60 36 63 Z" fill="#6b3f24"/>
    <!-- orange collar -->
    <path d="M30 60 L44 71 L38 78 L26 68 Z" fill="#e2753a"/>
    <path d="M58 60 L44 71 L50 78 L62 68 Z" fill="#e2753a"/>
    <!-- gold necklace -->
    <path d="M33 63 Q44 74 55 63" stroke="#e8b23a" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <!-- face -->
    <ellipse cx="44" cy="39" rx="17" ry="19" fill="#7a4a2b"/>
    <!-- ears + gold hoops -->
    <circle cx="27" cy="40" r="4" fill="#7a4a2b"/>
    <circle cx="61" cy="40" r="4" fill="#7a4a2b"/>
    <circle cx="27" cy="46" r="2.4" fill="none" stroke="#e8b23a" stroke-width="1.6"/>
    <circle cx="61" cy="46" r="2.4" fill="none" stroke="#e8b23a" stroke-width="1.6"/>
    <!-- hair / braids framing the face -->
    <path d="M44 13 C30 13 22 23 22 38 C22 44 23 49 25 53 C22 44 25 30 31 26 C29 33 30 41 33 46 C31 36 35 26 44 24 C53 26 57 36 55 46 C58 41 59 33 57 26 C63 30 66 44 63 53 C65 49 66 44 66 38 C66 23 58 13 44 13 Z" fill="#241c17"/>
    <!-- individual locs -->
    <g fill="#241c17">
      <rect x="21" y="40" width="4.5" height="20" rx="2.25"/>
      <rect x="26" y="46" width="4.5" height="18" rx="2.25"/>
      <rect x="57.5" y="46" width="4.5" height="18" rx="2.25"/>
      <rect x="62.5" y="40" width="4.5" height="20" rx="2.25"/>
    </g>
    <!-- soft brows + eyes -->
    <g fill="#2b2018">
      <ellipse cx="37" cy="39" rx="2.1" ry="2.4"/>
      <ellipse cx="51" cy="39" rx="2.1" ry="2.4"/>
    </g>
    <path d="M39 47 Q44 50 49 47" stroke="#5c3620" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  </g>
</svg>
