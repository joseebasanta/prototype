<svg viewBox="0 0 88 88" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Team member portrait">
  <!-- Second requester persona — a recolour of the base illustration (warmer skin, coral top, curly bun) so the avatar group reads as distinct people. -->
  <defs>
    <clipPath id="a2-clip"><circle cx="44" cy="44" r="44"/></clipPath>
  </defs>
  <g clip-path="url(#a2-clip)">
    <!-- coral shirt / shoulders -->
    <path d="M4 90 C4 68 22 59 44 59 C66 59 84 68 84 90 Z" fill="#d76a63"/>
    <!-- neck -->
    <rect x="36" y="48" width="16" height="18" rx="7" fill="#a86a40"/>
    <path d="M36 57 Q44 63 52 57 L52 63 Q44 60 36 63 Z" fill="#95592f"/>
    <!-- cream collar -->
    <path d="M31 60 L44 70 L39 77 L27 68 Z" fill="#f4e3c4"/>
    <path d="M57 60 L44 70 L49 77 L61 68 Z" fill="#f4e3c4"/>
    <!-- face -->
    <ellipse cx="44" cy="39" rx="17" ry="19" fill="#a86a40"/>
    <!-- ears + gold studs -->
    <circle cx="27" cy="40" r="4" fill="#a86a40"/>
    <circle cx="61" cy="40" r="4" fill="#a86a40"/>
    <circle cx="27" cy="43" r="1.4" fill="#e8b23a"/>
    <circle cx="61" cy="43" r="1.4" fill="#e8b23a"/>
    <!-- curly hair -->
    <path d="M44 13 C31 13 22 22 22 35 C18 34 17 41 21 43 C20 47 23 51 26 51 C22 40 26 27 33 25 C30 32 32 40 35 45 C33 34 37 25 44 24 C51 25 55 34 53 45 C56 40 58 32 55 25 C62 27 66 40 62 51 C65 51 68 47 67 43 C71 41 70 34 66 35 C66 22 57 13 44 13 Z" fill="#3a2a20"/>
    <!-- soft brows + eyes -->
    <g fill="#2b2018">
      <ellipse cx="37" cy="39" rx="2.1" ry="2.4"/>
      <ellipse cx="51" cy="39" rx="2.1" ry="2.4"/>
    </g>
    <path d="M39 47 Q44 50 49 47" stroke="#7a4326" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  </g>
</svg>
