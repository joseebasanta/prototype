<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Wallet wave — hover to ripple the cards</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="stage">
    <!--
      Hover / focus / tap the wallet to ripple the three inner cards in a
      continuous, bouncy wave: blue rises first, then green, then yellow, and
      the wave loops for as long as the hover is held.

      Layering mirrors the Figma stack (back → cards → front pocket). Each card
      is wrapped in an inner element: the outer .card holds the static stacking
      offset, the inner .card__inner runs the looping wave keyframe, so the two
      transforms never conflict and the motion eases back cleanly on leave.
      Every asset is a standalone SVG under assets/ — swap any file to reskin.
    -->
    <div class="wallet-scale">
      <div
        class="wallet"
        tabindex="0"
        role="button"
        aria-label="Wallet — hover to ripple the cards in a wave"
      >
        <img class="wallet-back" src="assets/wallet-back.svg" alt="" aria-hidden="true" />

        <div class="cards" aria-hidden="true">
          <div class="card card--blue"><div class="card__inner"><img src="assets/card-blue.svg" alt="" /></div></div>
          <div class="card card--green"><div class="card__inner"><img src="assets/card-green.svg" alt="" /></div></div>
          <div class="card card--yellow"><div class="card__inner"><img src="assets/card-yellow.svg" alt="" /></div></div>
        </div>

        <img class="wallet-front" src="assets/wallet-front.svg" alt="" aria-hidden="true" />

        <div class="balance" aria-hidden="true">
          <div class="balance__amount">$420.00</div>
          <div class="balance__label">Total Balance</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Touch devices have no :hover — toggle an explicit open state on tap.
    const wallet = document.querySelector(".wallet");
    wallet.addEventListener("click", () => wallet.classList.toggle("is-open"));
  </script>
</body>
</html>
