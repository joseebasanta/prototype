<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Deck spread — Select a card</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="stage">
    <!--
      Hover / focus / tap anywhere on the widget to spread the deck.
      Motion is transform-only (translateY + scale) so it stays GPU-smooth.
    -->
    <div class="deck-scale">
    <div
      class="deck-widget"
      tabindex="0"
      role="button"
      aria-label="Select a card — hover to spread the deck"
    >
      <div class="widget-header">
        <p class="widget-title">Select a card</p>
        <span class="widget-icon" aria-hidden="true">
          <!-- ion:card-outline (recreated inline) -->
          <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="3" y="7" width="26" height="18" rx="4.5" stroke="#111114" stroke-width="2" />
            <line x1="4" y1="13" x2="28" y2="13" stroke="#111114" stroke-width="2" />
            <rect x="7" y="17.5" width="6" height="4" rx="1.3" fill="#111114" />
          </svg>
        </span>
      </div>

      <!-- Reversed stacking: the LAST card sits in front (highest z-index). -->
      <div class="stack">
        <div class="item item--back">
          <div class="item-row">
            <span class="item-dot item-dot--amber"></span>
            <span class="item-bar item-bar--amber"></span>
          </div>
        </div>
        <div class="item item--mid">
          <div class="item-row">
            <span class="item-dot item-dot--green"></span>
            <span class="item-bar item-bar--green"></span>
          </div>
        </div>
        <div class="item item--front">
          <div class="item-row">
            <span class="item-dot item-dot--blue"></span>
            <span class="item-bar item-bar--blue"></span>
          </div>
        </div>
      </div>
    </div>
    </div>

    <p class="hint">Hover, focus, or tap the card to spread the deck</p>
  </div>

  <script>
    // Touch devices have no :hover — toggle an explicit open state on tap.
    const widget = document.querySelector(".deck-widget");
    widget.addEventListener("click", () => {
      widget.classList.toggle("is-open");
    });
  </script>
</body>
</html>
