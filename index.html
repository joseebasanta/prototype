<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Prototypes</title>
<style>
  :root {
    color-scheme: light dark;
  }
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont,
      "Helvetica Neue", Arial, sans-serif;
    background: #f4f4f5;
    color: #111114;
  }
  main {
    width: 100%;
    max-width: 480px;
    padding: 32px;
  }
  h1 {
    font-size: 22px;
    margin: 0 0 20px;
  }
  ul {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  a {
    display: block;
    padding: 16px 20px;
    border-radius: 14px;
    background: #ffffff;
    border: 1px solid #e2e2e5;
    color: inherit;
    text-decoration: none;
    font-size: 15px;
    font-weight: 500;
    transition: transform 150ms ease, border-color 150ms ease;
  }
  a:hover {
    transform: translateY(-2px);
    border-color: #c9c9cf;
  }
</style>
</head>
<body>
  <main>
    <h1>Prototypes</h1>
    <ul>
      <li><a href="prototypes/select-a-card/">Select a card — hover expand</a></li>
      <li><a href="prototypes/deck-spread/">Deck spread — hover to fan cards</a></li>
      <li><a href="prototypes/folder-fanout/">Folder fan-out — hover to reveal cards</a></li>
    </ul>
  </main>
</body>
</html>
